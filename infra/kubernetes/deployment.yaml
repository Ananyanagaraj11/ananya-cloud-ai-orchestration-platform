apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-ai-orchestration-api
  labels:
    app: cloud-ai-orchestration-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud-ai-orchestration-api
  template:
    metadata:
      labels:
        app: cloud-ai-orchestration-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8040"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: YOUR_REGISTRY/cloud-ai-orchestration-api:latest
          ports:
            - containerPort: 8040
          envFrom:
            - secretRef:
                name: cloud-ai-orchestration-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8040
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8040
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-ai-orchestration-api
spec:
  selector:
    app: cloud-ai-orchestration-api
  ports:
    - port: 80
      targetPort: 8040
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloud-ai-orchestration-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloud-ai-orchestration-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
