version: "3.9"
services:
  api:
    build: .
    ports:
      - "8040:8040"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/workflows
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8040

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workflows
    ports:
      - "5433:5432"

  redis:
    image: redis:7
    ports:
      - "6380:6379"
